# 2026-04-22 - LED candle Zigbee SED config by Claude (updated flash offset for Adafruit UF2 bootloader)
# 2026-04-22 - Disabled deep sleep (PM) to preserve UF2 bootloader double-tap detection (Claude)
CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_PWM=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# Zigbee as Sleepy End Device (not router - saves power)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_CHANNEL=25

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_CRYPTO_INIT_PRIORITY=80

CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

CONFIG_ZIGBEE_SCENES=y

# Random number generator for flicker
CONFIG_ENTROPY_GENERATOR=y

# Flash directly at 0x0 (no bootloader - ST-Link programming)
CONFIG_FLASH_LOAD_OFFSET=0x0
CONFIG_FLASH_LOAD_SIZE=0x100000
